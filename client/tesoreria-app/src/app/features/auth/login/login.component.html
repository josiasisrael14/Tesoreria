<div class="login-pagina">
  <form class="login-tarjeta" (ngSubmit)="iniciarSesion()">
    <header class="login-cabecera">
      <picture>
        <source srcset="logo-mmm-login.webp" type="image/webp" />
        <img src="logo-mmm-login.png" alt="Logo MMM" class="login-logo" width="220" height="136" />
      </picture>
      <p class="login-sistema">Sistema de Tesorería</p>
      <h1>Bienvenido de nuevo</h1>
      <p class="login-ayuda">Ingresa tus credenciales para continuar.</p>
    </header>

    @if (error()) {
      <div class="alerta-error login-error" role="alert">{{ error() }}</div>
    }

    <div class="login-campo">
      <label for="email">Correo</label>
      <div class="login-input">
        <svg class="login-icono" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="2" y="4" width="20" height="16" rx="2" />
          <path d="m22 7-10 6L2 7" />
        </svg>
        <input
          id="email"
          name="email"
          type="email"
          [(ngModel)]="email"
          required
          autocomplete="username"
          placeholder="nombre@correo.com"
        />
      </div>
    </div>

    <div class="login-campo">
      <label for="contrasena">Contraseña</label>
      <div class="login-input">
        <svg class="login-icono" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="11" width="18" height="11" rx="2" />
          <path d="M7 11V7a5 5 0 0 1 10 0v4" />
        </svg>
        <input
          id="contrasena"
          name="contrasena"
          [type]="verContrasena() ? 'text' : 'password'"
          [(ngModel)]="contrasena"
          required
          autocomplete="current-password"
        />
        <button
          type="button"
          class="login-ojo"
          (click)="alternarContrasena()"
          [attr.aria-label]="verContrasena() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          [attr.aria-pressed]="verContrasena()"
        >
          @if (verContrasena()) {
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
              <line x1="1" y1="1" x2="23" y2="23" />
            </svg>
          } @else {
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          }
        </button>
      </div>
    </div>

    <button type="submit" class="boton-primario login-boton" [disabled]="cargando()">
      @if (cargando()) {
        <span class="login-spinner" aria-hidden="true"></span>
      }
      {{ cargando() ? 'Ingresando…' : 'Ingresar' }}
    </button>

    <a routerLink="/olvide-contrasena" class="enlace-volver">¿Olvidaste tu contraseña?</a>
  </form>
</div>
