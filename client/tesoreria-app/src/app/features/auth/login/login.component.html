<div class="pagina-login">
  <form class="tarjeta-login" (ngSubmit)="iniciarSesion()">
    <img src="logo-mmm.png" alt="Tesorería" class="logo-login" />

    <h1>Iniciar sesión</h1>

    @if (error()) {
      <div class="alerta-error">{{ error() }}</div>
    }

    <div class="campo">
      <label for="email">Correo</label>
      <input id="email" name="email" type="email" [(ngModel)]="email" required autocomplete="username" />
    </div>

    <div class="campo">
      <label for="contrasena">Contraseña</label>
      <input id="contrasena" name="contrasena" type="password" [(ngModel)]="contrasena" required autocomplete="current-password" />
    </div>

    <button type="submit" class="boton-primario" [disabled]="cargando()">
      {{ cargando() ? 'Ingresando…' : 'Ingresar' }}
    </button>

    <a routerLink="/olvide-contrasena" class="enlace-volver">¿Olvidaste tu contraseña?</a>
  </form>
</div>
