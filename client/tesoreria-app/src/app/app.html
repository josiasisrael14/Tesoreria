@if (sinShell()) {
  <router-outlet />
} @else {
  <div class="app-shell">
    <aside class="barra-lateral" [class.barra-lateral-oculta]="sidebarOculta()">
      <div class="marca">
        <img src="logo-mmm.png" alt="Tesorería" class="marca-logo" />
        <span class="marca-texto">Tesorería</span>
      </div>

      <nav>
        <a routerLink="/dashboard" routerLinkActive="activo" [routerLinkActiveOptions]="{ exact: true }">
          <svg class="icono-nav" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2.5" y="2.5" width="6" height="6" rx="1"/>
            <rect x="11.5" y="2.5" width="6" height="6" rx="1"/>
            <rect x="2.5" y="11.5" width="6" height="6" rx="1"/>
            <rect x="11.5" y="11.5" width="6" height="6" rx="1"/>
          </svg>
          Dashboard
        </a>

        <a routerLink="/transacciones" routerLinkActive="activo" [routerLinkActiveOptions]="{ exact: false }">
          <svg class="icono-nav" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 3h10v14l-2.5-1.5L10 17l-2.5-1.5L5 17V3Z"/>
            <path d="M7.5 7h5M7.5 10h5"/>
          </svg>
          Transacciones
        </a>

        <a routerLink="/miembros" routerLinkActive="activo">
          <svg class="icono-nav" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="7" cy="6.5" r="2.5"/>
            <path d="M2.5 17c0-3 2-4.8 4.5-4.8s4.5 1.8 4.5 4.8"/>
            <circle cx="14.5" cy="7.5" r="2"/>
            <path d="M13 12.6c2.1.2 3.8 1.9 3.8 4.4"/>
          </svg>
          Miembros
        </a>

        <a routerLink="/fondos" routerLinkActive="activo">
          <svg class="icono-nav" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2.5" y="5.5" width="15" height="10" rx="2"/>
            <path d="M2.5 8.5h15"/>
            <circle cx="14" cy="11.8" r="1" fill="currentColor" stroke="none"/>
          </svg>
          Fondos
        </a>

        <a routerLink="/ofrendas-especiales" routerLinkActive="activo">
          <svg class="icono-nav" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="8" width="14" height="8.5" rx="1"/>
            <path d="M3 11.5h14"/>
            <path d="M10 8v8.5"/>
            <path d="M10 8c-1.8 0-3.2-1-3.2-2.5S7.4 3 9 3c1.3 0 1 2.5 1 5Z"/>
            <path d="M10 8c1.8 0 3.2-1 3.2-2.5S12.6 3 11 3c-1.3 0-1 2.5-1 5Z"/>
          </svg>
          Ofrendas especiales
        </a>

        <!-- Opción "Reportes" deshabilitada a pedido: se deja comentada (no borrada) por si se
             necesita reactivar más adelante. Mientras tanto no aparece en el menú.
        <a routerLink="/reportes" routerLinkActive="activo">
          <svg class="icono-nav" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 16.5V13M8 16.5V8M13 16.5v-5M18 16.5V4.5"/>
          </svg>
          Reportes
        </a>
        -->

        @if (authService.esAdministrador()) {
          <a routerLink="/usuarios" routerLinkActive="activo">
            <svg class="icono-nav" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="7.5" cy="6" r="2.8"/>
              <path d="M2.5 17c0-3.3 2.2-5.3 5-5.3s5 2 5 5.3"/>
              <path d="M14 7.2a2.3 2.3 0 1 0 0-4.6"/>
              <path d="M15.5 11.9c1.7.4 2.9 1.9 2.9 4.1"/>
            </svg>
            Usuarios
          </a>
        }
      </nav>
    </aside>

    <div class="panel-principal">
      <header class="barra-superior">
        <div class="barra-superior-izquierda">
          <button type="button" class="boton-icono boton-menu" title="Mostrar/ocultar menú" (click)="toggleSidebar()">
            <svg class="icono-nav" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 5.5h14M3 10h14M3 14.5h14"/>
            </svg>
          </button>
          <h1 class="barra-superior-titulo">{{ tituloPagina() }}</h1>
        </div>

        <div class="menu-usuario" #menuUsuario>
          <button type="button" class="menu-usuario-boton" (click)="toggleMenuUsuario($event)">
            @if (authService.usuarioActual()?.fotoUrl) {
              <img [src]="authService.usuarioActual()!.fotoUrl" alt="" class="avatar avatar-foto" />
            } @else {
              <span class="avatar">{{ (authService.usuarioActual()?.nombreCompleto || 'T').charAt(0).toUpperCase() }}</span>
            }
            <span class="menu-usuario-nombre">{{ authService.usuarioActual()?.nombreCompleto || 'Tesorero' }}</span>
            <svg class="icono-flecha" [class.icono-flecha-abierta]="menuUsuarioAbierto()"
                 viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 8l5 5 5-5"/>
            </svg>
          </button>

          @if (menuUsuarioAbierto()) {
            <div class="menu-usuario-desplegable">
              <button type="button" class="menu-usuario-item menu-usuario-item-activo" (click)="irAPerfil()">
                Mi perfil
              </button>
              <button type="button" class="menu-usuario-item menu-usuario-item-activo" (click)="cerrarSesion()">
                Cerrar sesión
              </button>
            </div>
          }
        </div>
      </header>

      <main class="contenido">
        <router-outlet />
      </main>
    </div>
  </div>
}

<app-dialogo-confirmacion />
